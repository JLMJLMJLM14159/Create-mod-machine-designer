<meta charset="utf-8">
<title>Create Factory Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: workshop bench — palette rail left, 3D floor centre, inspector drawer right, tool strip on top. */
:root {
  --bg: #e9e7e1; --panel: #f6f5f1; --panel-2: #ffffff; --line: #d2cec4; --fg: #23211d; --muted: #6c675d;
  --brass: #a8741c; --brass-soft: #f1e2c2; --copper: #b45c2c; --andesite: #8f9088;
  --ok: #2f8a4c; --warn: #b7791f; --bad: #c23b2b; --viewport: #d6d4cd;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16171a; --panel: #1d1f22; --panel-2: #24262a; --line: #33363b; --fg: #ebe7dd; --muted: #9a958a;
  --brass: #e0ad4f; --brass-soft: #3a3020; --copper: #df8551; --andesite: #a7a89f;
  --ok: #5cc27e; --warn: #e3a646; --bad: #f06a57; --viewport: #202226; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16171a; --panel: #1d1f22; --panel-2: #24262a; --line: #33363b; --fg: #ebe7dd; --muted: #9a958a;
  --brass: #e0ad4f; --brass-soft: #3a3020; --copper: #df8551; --andesite: #a7a89f;
  --ok: #5cc27e; --warn: #e3a646; --bad: #f06a57; --viewport: #202226; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 var(--font-body); overflow: hidden; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
#app { height: 100%; display: grid; grid-template-columns: 250px 1fr 350px; grid-template-rows: auto 1fr auto;
  grid-template-areas: "top top top" "pal view side" "status status status";
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
header { grid-area: top; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; margin-right: 6px; white-space: nowrap; }
.brand .cog { width: 20px; height: 20px; border-radius: 50%; background: conic-gradient(from 0deg, var(--brass) 0 12%, transparent 0 25%, var(--brass) 0 37%, transparent 0 50%, var(--brass) 0 62%, transparent 0 75%, var(--brass) 0 87%, transparent 0); position: relative; }
.brand .cog::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--brass); box-shadow: inset 0 0 0 3px var(--panel); }
.brand small { font: 500 11px var(--font-mono); color: var(--muted); letter-spacing: 0; }
.group { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 2px; }
.tbtn { border: 0; background: transparent; padding: 5px 9px; border-radius: 4px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.tbtn:hover { background: var(--panel-2); }
.tbtn[aria-pressed="true"] { background: var(--brass-soft); color: var(--fg); box-shadow: inset 0 0 0 1px var(--brass); }
.tbtn kbd { font: 10px var(--font-mono); color: var(--muted); }
.spacer { flex: 1; }
.layer { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.layer input { width: 110px; accent-color: var(--brass); }
.layer output { font-family: var(--font-mono); color: var(--fg); min-width: 2.5em; }
#palette { grid-area: pal; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.search { padding: 10px; border-bottom: 1px solid var(--line); }
.search input { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); }
#palList { overflow-y: auto; flex: 1; padding: 4px 0 16px; }
.cat h3 { font: 600 11px var(--font-display); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0; padding: 10px 12px 4px; display: flex; justify-content: space-between; cursor: pointer; user-select: none; }
.cat h3 span { font-family: var(--font-mono); letter-spacing: 0; }
.pitem { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 4px 12px; border-left: 3px solid transparent; }
.pitem:hover { background: var(--panel-2); }
.pitem[aria-pressed="true"] { background: var(--brass-soft); border-left-color: var(--brass); }
.swatch { width: 14px; height: 14px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.pitem .su { margin-left: auto; font: 11px var(--font-mono); color: var(--muted); }
#view { grid-area: view; position: relative; min-width: 0; min-height: 0; background: var(--viewport); }
#view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hint { position: absolute; left: 12px; bottom: 12px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; font-size: 12px; color: var(--muted); pointer-events: none; max-width: calc(100% - 24px); }
.hint b { color: var(--fg); font-weight: 600; }
.toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 6px 12px; border-radius: var(--r); font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
#side { grid-area: side; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 10px 10px 8px; font: 600 12px var(--font-display); letter-spacing: .04em; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--brass); }
.tab .n { font-family: var(--font-mono); font-size: 10px; padding: 0 5px; border-radius: 8px; background: var(--bad); color: #fff; margin-left: 4px; }
.pane { overflow-y: auto; flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.pane h2 { font: 700 17px var(--font-display); margin: 0; text-wrap: balance; }
.pane h4 { font: 600 11px var(--font-display); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 6px; }
.desc { color: var(--muted); margin: 4px 0 0; }
.kv { display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: 4px 12px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 10px; font: 500 11px var(--font-mono); border: 1px solid currentColor; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); } .chip.idle { color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--ok); }
.bar.warn i { background: var(--warn); } .bar.bad i { background: var(--bad); }
.field { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.field input[type=number], .field select, .field input[type=text] { width: 110px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); }
.field input[type=checkbox] { accent-color: var(--brass); width: 16px; height: 16px; }
.card { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.card.pick { cursor: pointer; } .card.pick:hover { border-color: var(--brass); }
.card.sel { border-color: var(--brass); box-shadow: inset 3px 0 0 var(--brass); }
.rec { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.it { display: inline-flex; gap: 4px; align-items: baseline; padding: 2px 6px; border-radius: 4px; background: var(--bg); font-size: 12px; }
.it b { font: 500 11px var(--font-mono); color: var(--brass); }
.it.fl { background: color-mix(in srgb, #3f76e4 16%, var(--bg)); }
.it.tag { font-style: italic; }
.arrow { color: var(--muted); padding: 0 2px; }
.meta { font: 11px var(--font-mono); color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.meta .t { color: var(--fg); }
.btn { border: 1px solid var(--line); background: var(--panel-2); padding: 5px 10px; border-radius: var(--r); }
.btn:hover { border-color: var(--brass); }
.btn.primary { background: var(--brass); border-color: var(--brass); color: #1b1408; font-weight: 600; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.issue { display: grid; grid-template-columns: 6px 1fr; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); cursor: pointer; }
.issue::before { content: ""; border-radius: 3px; background: var(--muted); }
.issue.bad::before { background: var(--bad); } .issue.warn::before { background: var(--warn); } .issue.info::before { background: var(--andesite); }
.issue b { display: block; font-weight: 600; }
.issue span { color: var(--muted); font-size: 12px; }
table.prod { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
table.prod td, table.prod th { padding: 4px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.prod th { font: 600 10px var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
table.prod td.num { text-align: right; font-family: var(--font-mono); white-space: nowrap; }
.pos { color: var(--ok); } .neg { color: var(--bad); }
.empty { color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); padding: 14px; text-align: center; }
.mini { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
footer { grid-area: status; border-top: 1px solid var(--line); background: var(--panel); padding: 5px max(12px, env(safe-area-inset-right, 0px)) calc(5px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); font: 11px var(--font-mono); color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
footer b { color: var(--fg); font-weight: 500; }
.mobile-only { display: none; }
textarea#jsonBox { width: 100%; min-height: 120px; font: 11px var(--font-mono); border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); padding: 8px; }
@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; grid-template-areas: "top" "view" "status"; }
  #palette, #side { position: fixed; top: 0; bottom: 0; z-index: 20; width: min(340px, 88vw); transform: translateX(-105%); transition: transform .2s; padding-top: env(safe-area-inset-top, 0px); }
  #palette { left: 0; padding-left: env(safe-area-inset-left, 0px); }
  #side { right: 0; left: auto; transform: translateX(105%); padding-right: env(safe-area-inset-right, 0px); }
  #palette.open, #side.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.35); }
  .mobile-only { display: inline-flex; }
  .tbtn kbd { display: none; }
  .tbtn { padding: 5px 7px; }
  .brand small { display: none; }
  .hint { display: none; }
  .layer input { width: 80px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app">
  <header>
    <div class="brand"><span class="cog" aria-hidden="true"></span>Factory Planner <small id="ver">Create 6.0.11 · MC 1.21.1</small></div>
    <button class="tbtn mobile-only" id="openPal" type="button">Blocks</button>
    <div class="group" role="toolbar" aria-label="Tools">
      <button class="tbtn" data-tool="place" type="button" aria-pressed="true"><span class="lbl">Place</span><kbd>1</kbd></button>
      <button class="tbtn" data-tool="select" type="button" aria-pressed="false"><span class="lbl">Inspect</span><kbd>2</kbd></button>
      <button class="tbtn" data-tool="erase" type="button" aria-pressed="false"><span class="lbl">Erase</span><kbd>3</kbd></button>
      <button class="tbtn" data-tool="belt" type="button" aria-pressed="false"><span class="lbl">Belt / chain</span><kbd>4</kbd></button>
    </div>
    <div class="group">
      <button class="tbtn" id="rotBtn" type="button" title="Rotate placement (R)"><span class="lbl">Rotate</span><kbd>R</kbd></button>
      <button class="tbtn" id="undoBtn" type="button" title="Undo (Ctrl+Z)"><span class="lbl">Undo</span></button>
      <button class="tbtn" id="redoBtn" type="button" title="Redo (Ctrl+Y)"><span class="lbl">Redo</span></button>
      <button class="tbtn" id="netBtn" type="button" aria-pressed="false" title="Colour blocks by network status (N)"><span class="lbl">Networks</span><kbd>N</kbd></button>
    </div>
    <label class="layer" for="layer">Layer <input id="layer" type="range" min="0" max="32" value="32"><output id="layerOut">all</output></label>
    <span class="spacer"></span>
    <div class="group">
      <button class="tbtn" id="fileBtn" type="button">File</button>
      <button class="tbtn mobile-only" id="openSide" type="button">Details</button>
    </div>
  </header>
  <aside id="palette" aria-label="Block palette">
    <div class="search"><input id="palSearch" type="search" placeholder="Search 190+ blocks…" autocomplete="off"></div>
    <div id="palList"></div>
  </aside>
  <main id="view">
    <div class="hint" id="hint"></div>
    <div class="toast" id="toast" role="status"></div>
  </main>
  <aside id="side" aria-label="Details">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="inspect" aria-selected="true" type="button">Inspect</button>
      <button class="tab" role="tab" data-tab="networks" aria-selected="false" type="button">Power</button>
      <button class="tab" role="tab" data-tab="production" aria-selected="false" type="button">Production</button>
      <button class="tab" role="tab" data-tab="checks" aria-selected="false" type="button">Checks</button>
      <button class="tab" role="tab" data-tab="recipes" aria-selected="false" type="button">Recipes</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
  <footer id="status"><span>Loading recipes…</span></footer>
</div>
